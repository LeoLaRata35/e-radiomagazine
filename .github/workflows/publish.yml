name: Publish Articles

on:
  workflow_dispatch:
    inputs:
      draft_file:
        description: 'Draft file to publish (optional, publishes all if empty)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'drafts/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./scripts

      - name: Publish articles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node publish.js "${{ github.event.inputs.draft_file }}"
        working-directory: ./scripts

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "📝 Publish articles via GitHub Actions"
          git push