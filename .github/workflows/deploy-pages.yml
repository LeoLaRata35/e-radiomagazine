name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # El commit de "Regenerar índice" usa [skip ci] y además es hecho por el
  # bot de GitHub (sus pushes no disparan el evento push), así que sin este
  # trigger el JSON actualizado nunca se despliega en Pages.
  workflow_run:
    workflows: ["Regenerar índice de artículos"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
