<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Editor — E-Radio Magazine</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --toolbar-bg: #1a1a2e;
      --toolbar-border: #d4af37;
      --editor-bg: #f8f8fa;
      --editor-text: #1a1a2e;
    }
    body { background: var(--bg-primary); padding-top: 0; }

    /* Header override */
    .header { position: relative; }

    /* Login Modal */
    .login-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .login-modal.hidden { display: none; }
    .login-box {
      background: #1a1a2e;
      border: 1px solid #d4af37;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.8);
    }
    .login-box h2 {
      color: #d4af37;
      margin-bottom: 24px;
      text-align: center;
      font-size: 1.5rem;
    }
    .login-box .form-group {
      margin-bottom: 16px;
    }
    .login-box label {
      display: block;
      color: #c8c8e0;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      background: #2a2a4a;
      border: 1px solid #d4af37;
      border-radius: 8px;
      color: #f0f0f5;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .login-box input:focus {
      outline: none;
      border-color: #ffed4e;
      box-shadow: 0 0 8px rgba(212,175,55,0.3);
    }
    .login-box .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #d4af37, #ffed4e);
      border: none;
      border-radius: 8px;
      color: #1a1a2e;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
      margin-top: 8px;
    }
    .login-box .btn-login:hover { transform: scale(1.02); }
    .login-box .error { color: #e74c3c; font-size: 0.85rem; margin-top: 8px; text-align: center; }

    /* Editor Layout */
    .editor-wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }

    /* Toolbar */
    .toolbar {
      background: var(--toolbar-bg);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .toolbar .group { display: flex; gap: 2px; align-items: center; }
    .toolbar .sep { width: 1px; height: 28px; background: var(--border); margin: 0 6px; }
    .toolbar button {
      background: transparent; border: none; color: #c8c8e0;
      width: 34px; height: 34px; border-radius: 6px;
      cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .toolbar button:hover { background: rgba(212,175,55,0.12); color: #d4af37; }
    .toolbar button.active { background: rgba(212,175,55,0.2); color: #d4af37; }
    .toolbar button.label-btn { width: auto; padding: 0 10px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #666688; cursor: default; }
    .toolbar button.label-btn:hover { background: transparent; }
    .toolbar select {
      background: #2a2a4a; color: #f0f0f5; border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; height: 34px;
    }
    .toolbar input[type=color] {
      width: 34px; height: 34px; padding: 2px; border: none; border-radius: 6px;
      background: transparent; cursor: pointer;
    }

    /* Editor Area */
    .editor-container {
      border: 1px solid var(--border);
      border-radius: 0 0 12px 12px;
      background: var(--editor-bg);
      min-height: 500px;
    }
    .editor-tabs {
      display: flex; border-bottom: 1px solid var(--border);
    }
    .editor-tabs button {
      flex: 1; padding: 12px; border: none; background: transparent;
      color: #666688; font-weight: 600; font-size: 0.85rem; cursor: pointer;
      transition: all 0.2s;
    }
    .editor-tabs button.active { background: #fff; color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
    #visualEditor {
      padding: 24px; min-height: 450px; outline: none;
      font-size: 16px; line-height: 1.8; color: var(--editor-text);
    }
    #visualEditor:empty::before { content: 'Escribe aquí tu artículo...'; color: #b0b0c0; }
    #htmlEditor {
      display: none; width: 100%; min-height: 450px; padding: 16px;
      background: #1a1a2e; color: #e8e8f0; border: none; outline: none;
      resize: vertical; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; line-height: 1.5;
      box-sizing: border-box;
    }

    /* Panels */
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
    .panel {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .panel h3 { font-size: 1rem; margin-bottom: 12px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .panel h3 span { font-size: 1.2rem; }
    .panel input[type=text], .panel input[type=url], .panel input[type=password] {
      width: 100%; padding: 10px 12px; margin-bottom: 8px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-primary); font-size: 0.9rem; box-sizing: border-box;
    }
    .panel button {
      background: var(--accent-gradient); color: #fff; border: none;
      padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; transition: transform 0.2s;
    }
    .panel button:hover { transform: scale(1.02); }
    .panel button.secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
    .panel button.danger { background: #e74c3c; }
    .panel label { display: block; color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 4px; }
    .panel .hint { color: #666688; font-size: 0.75rem; margin-top: 4px; }

    /* Status */
    .status-bar {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 16px; margin-top: 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .status-bar .msg { color: var(--text-secondary); font-size: 0.85rem; }
    .status-bar .msg.success { color: #2ecc71; }
    .status-bar .msg.error { color: #e74c3c; }

    /* Progress */
    .progress-bar {
      height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; display: none;
    }
    .progress-bar div { height: 100%; background: var(--accent-gradient); width: 0%; border-radius: 2px; transition: width 0.3s; }

    /* Floating media toolbar */
    .media-toolbar {
      position: absolute; display: none; background: #fff; border: 1px solid #ddd;
      border-radius: 8px; padding: 4px 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      z-index: 100; gap: 4px; align-items: center; white-space: nowrap;
    }
    .media-toolbar.show { display: inline-flex; }
    .media-toolbar button {
      background: #f0f0f0; border: none; border-radius: 4px; padding: 2px 8px;
      cursor: pointer; font-size: 13px; line-height: 1.6;
    }
    .media-toolbar button:hover { background: #e0e0e0; }
    .media-toolbar .sep { width: 1px; height: 20px; background: #ddd; margin: 0 4px; display: inline-block; }
    #visualEditor img, #visualEditor video { cursor: pointer; }
    #visualEditor figure { display: inline-block; margin: 12px 0; position: relative; }

    /* Logout button */
    .logout-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      z-index: 100;
    }
    .logout-btn:hover { background: #c0392b; }

    @media (max-width: 768px) {
      .panels { grid-template-columns: 1fr; }
      .toolbar { gap: 2px; padding: 6px 8px; }
      .toolbar button { width: 30px; height: 30px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<!-- Login Modal -->
<div class="login-modal" id="loginModal">
  <div class="login-box">
    <h2>🔐 Editor Privado</h2>
    <div class="form-group">
      <label for="passwordInput">Contraseña:</label>
      <input type="password" id="passwordInput" placeholder="Ingresa la contraseña" onkeypress="if(event.key==='Enter') authenticate()">
    </div>
    <button class="btn-login" onclick="authenticate()">Acceder</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<button class="logout-btn" id="logoutBtn" style="display:none;" onclick="logout()">Cerrar sesión</button>

<div id="editorContent" style="display:none;">

<header class="header">
  <div class="container">
    <div class="header-content">
      <div class="header-left">
        <a href="index.html" class="logo"><img src="assets/E-Radio%20Magazine%20HORIZONTAL.png" alt="E-Radio Magazine" style="height: 60px; display: block;"></a>
      </div>
      <nav class="nav">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="index.html">Anime</a></li>
          <li><a href="index.html">Manga</a></li>
          <li><a href="https://radioakari.blogspot.com/" class="nav-blog-link" target="_blank">Radio Akari</a></li>
        </ul>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="Menú"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="editor-wrap">

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <button class="label-btn">✎</button>
    <div class="sep"></div>
    <div class="group">
      <button onclick="exec('bold')" title="Negrita"><b>B</b></button>
      <button onclick="exec('italic')" title="Cursiva"><i>I</i></button>
      <button onclick="exec('underline')" title="Subrayado"><u>S</u></button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <select onchange="exec('formatBlock', this.value)" title="Título">
        <option value="">Normal</option>
        <option value="h1">H1</option>
        <option value="h2">H2</option>
        <option value="h3">H3</option>
        <option value="h4">H4</option>
        <option value="pre">Código</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="group">
      <select onchange="exec('fontName', this.value)" title="Fuente">
        <option value="Segoe UI">Segoe UI</option>
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
        <option value="Verdana">Verdana</option>
      </select>
      <select onchange="exec('fontSize', this.value)" title="Tamaño">
        <option value="3">Normal</option>
        <option value="1">Pequeño</option>
        <option value="4">Grande</option>
        <option value="5">Muy grande</option>
        <option value="6">Enorme</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="group">
      <input type="color" onchange="exec('foreColor', this.value)" title="Color texto" value="#d4af37">
      <input type="color" onchange="exec('hiliteColor', this.value)" title="Resaltado" value="#fff3cd">
    </div>
    <div class="sep"></div>
    <div class="group">
      <button onclick="exec('undo')" title="Deshacer">↩</button>
      <button onclick="exec('redo')" title="Rehacer">↪</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button onclick="exec('undo')" title="Deshacer">↩</button>
      <button onclick="exec('redo')" title="Rehacer">↪</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button onclick="insertLink()" title="Insertar enlace">🔗</button>
      <button onclick="exec('unlink')" title="Quitar enlace">🚫</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button onclick="insertImageUrl()" title="Imagen desde URL">🖼️</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button onclick="exec('removeFormat')" title="Limpiar formato">✖</button>
    </div>
  </div>

  <!-- Editor -->
  <div class="editor-container">
    <div class="editor-tabs">
      <button class="active" onclick="switchTab('visual')">Visual</button>
      <button onclick="switchTab('html')">HTML</button>
    </div>
    <div id="visualEditor" contenteditable="true"></div>
    <textarea id="htmlEditor"></textarea>
  </div>

  <!-- Panels -->
  <div class="panels">
    <!-- Article Info -->
    <div class="panel">
      <h3>📝 Información del Artículo</h3>
      <label>Nombre del archivo (sin .html):</label>
      <input type="text" id="fileName" placeholder="ej: articulo-nuevo-anime">
      <label>Categoría:</label>
      <select id="articleCategory">
        <option value="anime">Anime</option>
        <option value="manga">Manga</option>
        <option value="reviews">Reviews</option>
        <option value="musica">Música</option>
        <option value="videojuegos">Videojuegos</option>
        <option value="cine">Cine</option>
      </select>
      <div style="margin-top: 12px;">
        <button onclick="publishArticle()">📤 Publicar Artículo</button>
        <div class="progress-bar" id="pubProgress"><div></div></div>
      </div>
    </div>

    <!-- GitHub Token -->
    <div class="panel">
      <h3>🔑 Autenticación GitHub</h3>
      <label>Token Personal (PAT):</label>
      <input type="password" id="githubToken" placeholder="Tu token de GitHub">
      <div class="hint">Necesita permisos: repo, workflow</div>
      <button class="secondary" onclick="saveToken()">💾 Guardar Token</button>
    </div>

    <!-- Multimedia -->
    <div class="panel">
      <h3>🖼️ Multimedia</h3>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
        <button class="secondary" onclick="document.getElementById('fileInputImage').click()">🖼️ Imagen</button>
        <button class="secondary" onclick="insertYouTube()">📺 YouTube</button>
        <button class="secondary" onclick="document.getElementById('fileInputVideo').click()">📹 Video</button>
      </div>
      <input type="file" id="fileInputImage" accept="image/*" style="display:none" onchange="handleImageFiles(this.files)">
      <input type="file" id="fileInputVideo" accept="video/*" style="display:none" onchange="handleVideoFiles(this.files)">
      <div id="youtubeInput" style="display:none;margin-top:8px;">
        <label>URL de YouTube:</label>
        <div style="display:flex;gap:4px;">
          <input type="text" id="youtubeUrl" placeholder="https://youtu.be/..." style="flex:1;">
          <button onclick="addYouTubeVideo()">Insertar</button>
        </div>
      </div>
      <div class="hint">Pegá imágenes con Ctrl+V. Al publicar se suben a GitHub.</div>
    </div>

    <!-- Kit para Redes -->
    <div class="panel">
      <h3>🎯 Kit para Redes</h3>
      <button onclick="generateSocialKit()">🎯 Generar kit</button>
      <div id="socialKitOutput" style="display:none;margin-top:12px;">
        <div style="margin-bottom:10px;">
          <label style="font-weight:600;font-size:0.75rem;">SEO (140 caracteres)</label>
          <div style="display:flex;gap:4px;">
            <textarea id="kitSeo" rows="2" style="flex:1;font-size:0.8rem;padding:4px;" readonly></textarea>
            <button class="secondary" onclick="copyKit('kitSeo')" title="Copiar">📋</button>
          </div>
        </div>
        <div style="margin-bottom:10px;">
          <label style="font-weight:600;font-size:0.75rem;">Copy 1</label>
          <div style="display:flex;gap:4px;">
            <textarea id="kitCopy1" rows="3" style="flex:1;font-size:0.8rem;padding:4px;" readonly></textarea>
            <button class="secondary" onclick="copyKit('kitCopy1')" title="Copiar">📋</button>
          </div>
        </div>
        <div style="margin-bottom:10px;">
          <label style="font-weight:600;font-size:0.75rem;">Copy 2</label>
          <div style="display:flex;gap:4px;">
            <textarea id="kitCopy2" rows="3" style="flex:1;font-size:0.8rem;padding:4px;" readonly></textarea>
            <button class="secondary" onclick="copyKit('kitCopy2')" title="Copiar">📋</button>
          </div>
        </div>
        <div style="margin-bottom:10px;">
          <label style="font-weight:600;font-size:0.75rem;">Copy 3</label>
          <div style="display:flex;gap:4px;">
            <textarea id="kitCopy3" rows="3" style="flex:1;font-size:0.8rem;padding:4px;" readonly></textarea>
            <button class="secondary" onclick="copyKit('kitCopy3')" title="Copiar">📋</button>
          </div>
        </div>
        <div style="margin-bottom:10px;">
          <label style="font-weight:600;font-size:0.75rem;">Resumen afiche</label>
          <div style="display:flex;gap:4px;">
            <textarea id="kitPoster" rows="2" style="flex:1;font-size:0.8rem;padding:4px;" readonly></textarea>
            <button class="secondary" onclick="copyKit('kitPoster')" title="Copiar">📋</button>
          </div>
        </div>
        <div>
          <label style="font-weight:600;font-size:0.75rem;">Hashtags</label>
          <div style="display:flex;gap:4px;">
            <textarea id="kitHashtags" rows="2" style="flex:1;font-size:0.8rem;padding:4px;" readonly></textarea>
            <button class="secondary" onclick="copyKit('kitHashtags')" title="Copiar">📋</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating toolbar for media -->
  <div class="media-toolbar" id="mediaToolbar">
    <button onclick="mediaAction('resize',-0.1)" title="Reducir">−</button>
    <button onclick="mediaAction('resize',0.1)" title="Agrandar">+</button>
    <span class="sep"></span>
    <button onclick="mediaAction('align','left')" title="Izquierda">◀</button>
    <button onclick="mediaAction('align','center')" title="Centro">●</button>
    <button onclick="mediaAction('align','right')" title="Derecha">▶</button>
    <span class="sep"></span>
    <button onclick="mediaAction('remove')" title="Eliminar" style="color:#e74c3c;">✕</button>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="msg" id="statusMsg">Listo para editar</div>
  </div>

</div>

</div>

<script>
  let activeTab = 'visual';
  let visual = document.getElementById('visualEditor');
  let htmlArea = document.getElementById('htmlEditor');
  const PASSWORD = 'E-Radio2026'; // Contraseña simple (cambiar en producción)

  // ===== AUTHENTICATION =====
  function authenticate() {
    const password = document.getElementById('passwordInput').value;
    if (password === PASSWORD) {
      localStorage.setItem('editor_auth', 'true');
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('editorContent').style.display = 'block';
      document.getElementById('logoutBtn').style.display = 'block';
      document.getElementById('passwordInput').value = '';
    } else {
      document.getElementById('loginError').textContent = '❌ Contraseña incorrecta';
      document.getElementById('passwordInput').value = '';
    }
  }

  function logout() {
    localStorage.removeItem('editor_auth');
    document.getElementById('loginModal').classList.remove('hidden');
    document.getElementById('editorContent').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('passwordInput').value = '';
  }

  // Check auth on load
  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('editor_auth') === 'true') {
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('editorContent').style.display = 'block';
      document.getElementById('logoutBtn').style.display = 'block';
      const saved = localStorage.getItem('gh_token');
      if (saved) document.getElementById('githubToken').value = saved;
    }
  });

  // ===== EDITOR FUNCTIONS =====
  function exec(cmd, val) {
    document.execCommand(cmd, false, val);
    visual.focus();
  }

  function switchTab(tab) {
    activeTab = tab;
    const buttons = document.querySelectorAll('.editor-tabs button');
    buttons.forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    if (tab === 'visual') {
      visual.style.display = 'block';
      htmlArea.style.display = 'none';
      visual.innerHTML = htmlArea.value;
    } else {
      visual.style.display = 'none';
      htmlArea.style.display = 'block';
      htmlArea.value = visual.innerHTML;
    }
  }

  function syncVisualToHtml() {
    htmlArea.value = visual.innerHTML;
  }

  // ===== PUBLISH TO GITHUB =====
  function sanitizeFilename(name) {
    return name
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[^a-z0-9\u00f1\u00d1\u00e1-\u00fa-\u00fc_.-]/g, '')
      .replace(/-+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  function extractTitle(html) {
    const m = html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i) || html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    if (m) return m[1].replace(/<[^>]+>/g, '').trim();
    return null;
  }

  function extractFirstImage(html) {
    const m = html.match(/<img[^>]+src="(https?:\/\/[^"]+)"[^>]*>/i);
    return m ? m[1] : null;
  }

  function dataUriToBase64(dataUri) {
    const parts = dataUri.split(',');
    return parts[1];
  }

  async function publishArticle() {
    const rawFileName = document.getElementById('fileName').value.trim();
    const fileName = sanitizeFilename(rawFileName) || 'articulo';
    const token = document.getElementById('githubToken').value.trim() || localStorage.getItem('gh_token') || '';

    if (!rawFileName) return setStatus('❌ Introduce el nombre del archivo', 'error');
    if (!token) return setStatus('❌ Introduce tu token de GitHub', 'error');

    setStatus('⏳ Publicando...', '');
    showProgress('pubProgress', 10);

    try {
      let htmlContent = activeTab === 'html' ? htmlArea.value : visual.innerHTML;

      // Process embedded images
      const dataUriRegex = /<img[^>]+src="(data:image\/[^"]+)"[^>]*>/g;
      let imgMatch;
      let imgIndex = 0;
      let htmlWithUrls = htmlContent;

      const replacements = [];
      while ((imgMatch = dataUriRegex.exec(htmlContent)) !== null) {
        const fullTag = imgMatch[0];
        const dataUri = imgMatch[1];
        const ext = dataUri.match(/image\/(\w+)/)?.[1] || 'png';
        const imgFileName = `${fileName}-${++imgIndex}.${ext}`;
        replacements.push({ dataUri, imgFileName, fullTag });
      }

      showProgress('pubProgress', 15);

      // Upload images
      for (const r of replacements) {
        setStatus(`⏳ Subiendo imagen ${r.imgFileName}...`, '');
        const imgPath = `assets/${r.imgFileName}`;
        const imgApiUrl = `https://api.github.com/repos/LeoLaRata35/e-radiomagazine/contents/${imgPath}`;

        let imgSha = '';
        try {
          const check = await fetch(imgApiUrl, { headers: { Authorization: `token ${token}` } });
          if (check.ok) { const d = await check.json(); imgSha = d.sha; }
        } catch(e) {}

        const imgContent = dataUriToBase64(r.dataUri);
        const uploadResp = await fetch(imgApiUrl, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: imgSha ? `Actualizar ${r.imgFileName}` : `Agregar ${r.imgFileName}`,
            content: imgContent,
            sha: imgSha || undefined,
            branch: 'main'
          })
        });

        if (!uploadResp.ok) {
          const err = await uploadResp.json();
          throw new Error(`Error al subir imagen ${r.imgFileName}: ${err.message}`);
        }

        const imgUrl = `https://raw.githubusercontent.com/LeoLaRata35/e-radiomagazine/main/assets/${r.imgFileName}`;
        htmlWithUrls = htmlWithUrls.replace(r.dataUri, imgUrl);
      }

      showProgress('pubProgress', 30);

      // Extract metadata
      const articleTitle = extractTitle(htmlContent) || fileName.replace(/^articulo-/, '').replace(/-/g, ' ');
      const firstImg = extractFirstImage(htmlWithUrls) || `https://LeoLaRata35.github.io/e-radiomagazine/assets/E-Radio%20Magazine%20HORIZONTAL.png`;
      const desc = (htmlWithUrls.match(/<p[^>]*>(.*?)<\/p>/) || ['', 'Artículo'])[1].replace(/<[^>]+>/g, '').substring(0, 160);
      const category = document.getElementById('articleCategory').value;

      // Generate date
      const now = new Date();
      const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      const dateStr = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

      const fullHtml = `<!DOCTYPE html>
<html lang="es">
<head>

</header>

  <div style="padding:40px;font-family:'Segoe UI',Arial,sans-serif;line-height:1.8;color:#1a1a2e;">
    ${htmlWithUrls}
  </div>
</div>
<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <a href="../index.html" class="logo"><img src="../assets/E-Radio%20Magazine%20HORIZONTAL.png" alt="E-Radio" style="height:50px;display:block;"></a>

<script src="../js/main.js"><\/script>

      // Upload article
      const articlePath = `articulos/${fileName}.html`;
      const articleApiUrl = `https://api.github.com/repos/LeoLaRata35/e-radiomagazine/contents/${articlePath}`;

      let articleSha = '';
      try {
        const checkResp = await fetch(articleApiUrl, { headers: { Authorization: `token ${token}` } });
        if (checkResp.ok) { const d = await checkResp.json(); articleSha = d.sha; }
      } catch(e) {}

      showProgress('pubProgress', 70);

      const content = btoa(unescape(encodeURIComponent(fullHtml)));
      const uploadResp = await fetch(articleApiUrl, {
        method: 'PUT',
        headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: articleSha ? `Actualizar ${fileName}` : `Agregar ${fileName}`,
          content: content,
          sha: articleSha || undefined,
          branch: 'main'
        })
      });

      if (!uploadResp.ok) {
        const err = await uploadResp.json();
        throw new Error(err.message || 'Error al subir artículo');
      }

      // Update index.html
      showProgress('pubProgress', 80);
      setStatus('⏳ Actualizando portada...', '');

      const indexApiUrl = 'https://api.github.com/repos/LeoLaRata35/e-radiomagazine/contents/index.html';

      let idxMetaResp, idxMeta, indexSha, indexHtml;
      
      try {
        idxMetaResp = await fetch(indexApiUrl, { headers: { Authorization: `token ${token}` } });
        if (!idxMetaResp.ok) throw new Error('Status: ' + idxMetaResp.status);
        idxMeta = await idxMetaResp.json();
        indexSha = idxMeta.sha;
        // Decodificar contenido desde base64
        indexHtml = decodeURIComponent(escape(atob(idxMeta.content)));
      } catch(e) {
        throw new Error('Error al obtener index.html: ' + e.message);
      }

      // Build card
      const cardHtml = `<article class="article-card" data-category="${category}">
          <div class="article-img" style="background-image: url('${firstImg}');">
            <span class="article-date">${dateStr}</span>
          </div>
          <div class="article-content">
            <span class="article-category">${category.charAt(0).toUpperCase() + category.slice(1)}</span>
            <h3>${articleTitle}</h3>
            <p>${desc}</p>
            <a href="articulos/${fileName}.html" class="read-more">Seguir leyendo</a>
          </div>
        </article>`;

      // Insert at top of grid - buscar la primera tarjeta existente
      const cardRegex = /<article\s+class=["']article-card["']/i;
      const cardMatch = indexHtml.match(cardRegex);
      
      if (!cardMatch) {
        // Debug: mostrar primeros caracteres para diagnosticar
        console.log('indexHtml primeros 500 chars:', indexHtml.substring(0, 500));
        console.log('indexHtml length:', indexHtml.length);
        throw new Error('No se encontró la primera tarjeta de artículo en index.html. Revisá la consola (F12) para más detalles.');
      }
      
      const insertPos = cardMatch.index;
      indexHtml = indexHtml.slice(0, insertPos) + cardHtml + '\n' + indexHtml.slice(insertPos);

      const indexContent = btoa(unescape(encodeURIComponent(indexHtml)));
      const indexResp = await fetch(indexApiUrl, {
        method: 'PUT',
        headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Agregar tarjeta: ${articleTitle}`,
          content: indexContent,
          sha: indexSha,
          branch: 'main'
        })
      });
      if (!indexResp.ok) {
        const errData = await indexResp.json().catch(() => ({}));
        console.error('GitHub API Error:', errData);
        console.error('Index HTML enviado:', indexContent.substring(0, 500));
        throw new Error('Error al actualizar portada: ' + (errData.message || indexResp.statusText || indexResp.status));
      }

      showProgress('pubProgress', 100);
      setStatus(`✅ Publicado: ${fileName}.html (portada actualizada)`, 'success');
      setTimeout(() => hideProgress('pubProgress'), 3000);

    } catch (e) {
      showProgress('pubProgress', 0);
      hideProgress('pubProgress');
      setStatus('❌ Error: ' + e.message, 'error');
      console.error('Error detallado:', e);
    }
  }

  function saveToken() {
    const token = document.getElementById('githubToken').value.trim();
    if (!token) return alert('Pega tu token de GitHub primero');
    localStorage.setItem('gh_token', token);
    setStatus('✅ Token guardado localmente', 'success');
    alert('✅ Token guardado en el navegador');
  }

  function setStatus(msg, type) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'msg' + (type ? ' ' + type : '');
  }

  function showProgress(id, pct) {
    const bar = document.getElementById(id);
    bar.style.display = 'block';
    bar.querySelector('div').style.width = pct + '%';
  }

  function hideProgress(id) {
    document.getElementById(id).style.display = 'none';
  }

  /* ===== Media Tools ===== */
  let activeMedia = null;
  let lastVisualRange = null;

  // Save cursor position when visual editor loses focus
  visual.addEventListener('blur', function() {
    var sel = window.getSelection();
    if (sel.rangeCount > 0 && sel.getRangeAt(0).startContainer && visual.contains(sel.getRangeAt(0).startContainer)) {
      lastVisualRange = sel.getRangeAt(0).cloneRange();
    }
  });

  // Restore cursor when clicking back into editor
  visual.addEventListener('mousedown', function() {
    lastVisualRange = null;
  });

  visual.addEventListener('click', function(e) {
    var el = e.target;
    if (el.tagName === 'IMG' || el.tagName === 'VIDEO') {
      activeMedia = el;
      showMediaToolbar(el);
    } else if (el.closest('figure')) {
      activeMedia = el.closest('figure').querySelector('img, video') || el.closest('figure');
      showMediaToolbar(activeMedia);
    } else {
      hideMediaToolbar();
    }
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.media-toolbar') && !e.target.closest('#visualEditor img') && !e.target.closest('#visualEditor figure') && !e.target.closest('#visualEditor video')) {
      hideMediaToolbar();
    }
  });

  function showMediaToolbar(el) {
    var tb = document.getElementById('mediaToolbar');
    var rect = el.getBoundingClientRect();
    var editorRect = visual.getBoundingClientRect();
    tb.style.top = (rect.top - editorRect.top - 40) + 'px';
    tb.style.left = Math.max(0, rect.left - editorRect.left + (rect.width / 2) - 80) + 'px';
    tb.classList.add('show');
  }

  function hideMediaToolbar() {
    document.getElementById('mediaToolbar').classList.remove('show');
    activeMedia = null;
  }

  function mediaAction(action, val) {
    if (!activeMedia) return;
    if (action === 'resize') {
      var p = activeMedia.tagName === 'FIGURE' ? 1 : (parseFloat(activeMedia.style.width) || 100) / 100;
      p = Math.max(0.1, Math.min(3, p + val));
      activeMedia.style.width = (p * 100) + '%';
      if (activeMedia.tagName !== 'FIGURE') activeMedia.style.height = 'auto';
    } else if (action === 'align') {
      if (activeMedia.tagName === 'FIGURE') {
        activeMedia.style.display = val === 'center' ? 'block' : 'inline-block';
        activeMedia.style.textAlign = val === 'center' ? 'center' : '';
        activeMedia.style.marginLeft = val === 'right' ? 'auto' : '';
        activeMedia.style.marginRight = val === 'left' ? 'auto' : '';
      } else {
        activeMedia.style.display = val === 'center' ? 'block' : 'inline-block';
        activeMedia.style.marginLeft = val === 'right' ? 'auto' : (val === 'center' ? 'auto' : '');
        activeMedia.style.marginRight = val === 'left' ? 'auto' : (val === 'center' ? 'auto' : '');
      }
      activeMedia.setAttribute('data-align', val);
    } else if (action === 'remove') {
      var fig = activeMedia.closest('figure');
      if (fig) fig.remove(); else activeMedia.remove();
      hideMediaToolbar();
    }
    syncVisualToHtml();
  }

  /* Toolbar: Link */
  function insertLink() {
    var url = prompt('URL del enlace:', 'https://');
    if (url) exec('createLink', url);
  }

  /* Toolbar: Image from URL */
  function insertImageUrl() {
    var url = prompt('URL de la imagen:', 'https://');
    if (url) {
      var img = document.createElement('img');
      img.src = url;
      img.style.maxWidth = '100%';
      insertMediaNode(img);
    }
  }

  /* Insert media at saved cursor position */
  function insertAtCursor(node) {
    visual.focus();
    var sel = window.getSelection();
    var range;

    if (lastVisualRange) {
      range = lastVisualRange;
      lastVisualRange = null;
      sel.removeAllRanges();
      sel.addRange(range);
    } else if (sel.rangeCount > 0) {
      range = sel.getRangeAt(0);
    } else {
      visual.appendChild(node);
      visual.appendChild(document.createElement('br'));
      syncVisualToHtml();
      return;
    }

    range.deleteContents();
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
    syncVisualToHtml();
  }

  /* Image upload */
  function handleImageFiles(files) {
    for (var i = 0; i < files.length; i++) {
      (function(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = document.createElement('img');
          img.src = e.target.result;
          img.style.maxWidth = '100%';
          var fig = document.createElement('figure');
          fig.contentEditable = false;
          fig.style.display = 'inline-block';
          fig.style.margin = '12px 0';
          fig.style.position = 'relative';
          fig.appendChild(img);
          insertAtCursor(fig);
        };
        reader.readAsDataURL(file);
      })(files[i]);
    }
  }

  /* Video upload */
  function handleVideoFiles(files) {
    for (var i = 0; i < files.length; i++) {
      (function(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var vid = document.createElement('video');
          vid.src = e.target.result;
          vid.controls = true;
          vid.style.maxWidth = '100%';
          var fig = document.createElement('figure');
          fig.contentEditable = false;
          fig.style.display = 'inline-block';
          fig.style.margin = '12px 0';
          fig.style.position = 'relative';
          fig.appendChild(vid);
          insertAtCursor(fig);
        };
        reader.readAsDataURL(file);
      })(files[i]);
    }
  }

  /* YouTube - iframe embed */
  function insertYouTube() {
    var panel = document.getElementById('youtubeInput');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    if (panel.style.display === 'block') document.getElementById('youtubeUrl').focus();
  }

  function addYouTubeVideo() {
    var url = document.getElementById('youtubeUrl').value.trim();
    document.getElementById('youtubeUrl').value = '';
    document.getElementById('youtubeInput').style.display = 'none';

    var match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
    if (!match) return setStatus('❌ URL de YouTube no válida', 'error');

    var id = match[1];

    var fig = document.createElement('figure');
    fig.contentEditable = false;
    fig.style.cssText = 'display:inline-block;margin:12px 0;position:relative;width:100%;max-width:720px;';

    var wrapper = document.createElement('div');
    wrapper.style.cssText = 'position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;';

    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube-nocookie.com/embed/' + id;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:none;';

    wrapper.appendChild(iframe);
    fig.appendChild(wrapper);
    insertAtCursor(fig);

    setStatus('✅ Video de YouTube insertado', 'success');
  }

  /* Paste handler for images */
  visual.addEventListener('paste', function(e) {
    var items = e.clipboardData.items;
    var hasImage = false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') === 0) {
        hasImage = true;
        e.preventDefault();
        (function(file) {
          var reader = new FileReader();
          reader.onload = function(ev) {
            var img = document.createElement('img');
            img.src = ev.target.result;
            img.style.maxWidth = '100%';
            var fig = document.createElement('figure');
            fig.contentEditable = false;
            fig.style.cssText = 'display:inline-block;margin:12px 0;position:relative;';
            fig.appendChild(img);
            insertAtCursor(fig);
          };
          reader.readAsDataURL(file);
        })(items[i].getAsFile());
      }
    }
    if (hasImage) setStatus('✅ Imagen pegada', 'success');
  });

  /* ===== Social Kit ===== */
  function extractKeyEntities(html) {
    var bolds = [];
    var boldRe = /<(?:strong|b)>([^<]+)<\/(?:strong|b)>/gi;
    var m;
    while ((m = boldRe.exec(html)) !== null) {
      var t = m[1].trim();
      if (t.length > 2 && bolds.indexOf(t) === -1) bolds.push(t);
    }
    var dateMatch = html.match(/(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)(\s+de\s+(\d{4}))?/gi);
    return { bolds: bolds.slice(0, 8), dates: dateMatch || [] };
  }

  function generateSocialKit() {
    var htmlContent = activeTab === 'html' ? htmlArea.value : visual.innerHTML;
    var category = document.getElementById('articleCategory').value;
    var title = extractTitle(htmlContent) || document.getElementById('fileName').value.trim().replace(/-/g, ' ') || 'Artículo';
    var paragraphs = htmlContent.match(/<p[^>]*>([\s\S]*?)<\/p>/gi) || [];
    var cleanPs = paragraphs.map(function(p) { return p.replace(/<[^>]+>/g, '').trim(); }).filter(function(p) { return p.length > 20; });
    var firstP = cleanPs[0] || '';
    var secondP = cleanPs[1] || '';
    var entities = extractKeyEntities(htmlContent);
    var siteUrl = 'https://LeoLaRata35.github.io/e-radiomagazine';
    var articleFile = document.getElementById('fileName').value.trim() || sanitizeFilename(title);
    var articleUrl = siteUrl + '/articulos/' + articleFile + '.html';

    var detailText = (firstP + ' ' + secondP).replace(/\s+/g, ' ').trim();
    if (detailText.length > 350) detailText = detailText.substring(0, 347) + '...';
    var firstSentence = (firstP.match(/^[^.!?]*[.!?]/) || [firstP.substring(0, 120)])[0];
    var keyFacts = entities.bolds.join(', ');
    if (keyFacts.length > 120) keyFacts = keyFacts.substring(0, 117) + '...';

    var emojiMap = { anime: '🎪', manga: '📖', reviews: '⭐', musica: '🎵', videojuegos: '🎮', cine: '🎬' };
    var emoji = emojiMap[category] || '📰';

    var seo = title + '. ' + (keyFacts ? keyFacts + '. ' : '') + (entities.dates[0] || '') + '.';
    if (seo.length > 140) seo = seo.substring(0, 137) + '...';

    var copy1 = emoji + ' ¡' + title + '! ' + detailText.substring(0, 250) + '\n\n' + articleUrl + '\n\n';
    var copy2Body = secondP ? secondP.substring(0, 250) : (entities.bolds.length > 2 ? entities.bolds.slice(0, 4).join(', ') : firstSentence);
    var copy2 = emoji + ' ' + title + ' — ' + copy2Body + '\n\n' + articleUrl + '\n\n';
    var copy3 = emoji + ' ' + title + '. ' + firstSentence + '\n\n' + articleUrl + '\n\n';

    var poster = title + '. ' + (keyFacts ? keyFacts + '. ' : '') + (entities.dates[0] || '');
    if (poster.length > 200) poster = poster.substring(0, 197) + '...';

    var titleTag = '#' + title.replace(/[^a-zA-Z0-9]/g, '');
    var entityTags = entities.bolds.slice(0, 3).map(function(e) {
      return '#' + e.replace(/[^a-zA-Z0-9]/g, '');
    }).join(' ');
    var dateTag = '';
    if (entities.dates[0]) {
      var dParts = entities.dates[0].match(/(\d{1,2})\s+de\s+(\w+)/);
      if (dParts) dateTag = '#' + dParts[2].charAt(0).toUpperCase() + dParts[2].slice(1) + dParts[1];
    }
    var categoryTags = { anime: '#Anime #AnimeNews', manga: '#Manga #MangaNews', reviews: '#Review', musica: '#Musica', videojuegos: '#Videojuegos', cine: '#Cine' };
    var baseTags = categoryTags[category] || '#Noticias';
    var allTags = [titleTag, entityTags, dateTag, baseTags].filter(Boolean).join(' ');

    copy1 += allTags;
    copy2 += allTags;
    copy3 += allTags;

    document.getElementById('kitSeo').value = seo;
    document.getElementById('kitCopy1').value = copy1;
    document.getElementById('kitCopy2').value = copy2;
    document.getElementById('kitCopy3').value = copy3;
    document.getElementById('kitPoster').value = poster;
    document.getElementById('kitHashtags').value = allTags;
    document.getElementById('socialKitOutput').style.display = 'block';
    setStatus('✅ Kit para redes generado', 'success');
  }

  function copyKit(id) {
    var ta = document.getElementById(id);
    ta.select();
    ta.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(ta.value).then(function() {
      setStatus('✅ "' + id + '" copiado al portapapeles', 'success');
    }).catch(function() {
      document.execCommand('copy');
      setStatus('✅ "' + id + '" copiado', 'success');
    });
  }
